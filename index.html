<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Atlas9 phone simulator and Mossman Script writer.">
  <title>Atlas9 Projects</title>
  <style>
    :root {
      color-scheme: light;
      font: 16px/1.5 system-ui, sans-serif;
      color: #172126;
      background: #f1f4f3;
    }

    body {
      box-sizing: border-box;
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      place-items: center;
    }

    main { width: min(100%, 640px); }
    h1 { margin-bottom: 4px; }
    .intro { margin-top: 0; color: #4d5b60; }

    nav { display: grid; gap: 14px; margin-top: 28px; }

    a {
      display: block;
      padding: 18px 20px;
      border: 1px solid #c5cfcc;
      border-radius: 10px;
      color: inherit;
      background: white;
      text-decoration: none;
    }

    a:hover, a:focus-visible {
      border-color: #176b58;
      outline: 2px solid #176b58;
      outline-offset: 2px;
    }

    a strong { display: block; color: #176b58; font-size: 1.15rem; }
    a span { color: #4d5b60; }
  </style>
</head>
<body>
  <main>
    <p>Bleep, bloop! This text generated by a robot.</p>
    <h1>Atlas9 Projects</h1>
    <p class="intro">Choose a project to open.</p>
    <nav aria-label="Atlas9 projects">
      <a href="TelephoneSimulator/">
        <strong>Phone Simulator</strong>
        <span>Explore the Atlas9 phone system.</span>
      </a>
      <a href="FontTranslator/writer/">
        <strong>Mossman Script Writer</strong>
        <span>Type text and render it in Mossman Script.</span>
      </a>
    </nav>
  </main>
</body>
</html>
